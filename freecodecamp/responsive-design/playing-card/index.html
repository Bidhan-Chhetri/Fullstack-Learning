<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="styles.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playing Cards</title>

</head>
<body>
    <main id="playing-cards">
        <div class="card card-1">
            <div class="left card-item">
                <div>A</div>
                <div>♠</div>
            </div>
            <div class="middle card-item">
                <div>♠</div>
            </div>
            <div class="right card-item">
                <div>A</div>
                <div>♠</div>
            </div>
        </div>
        <div class="card card-2">
            <div class="left card-item">
                <div>2</div>
                <div>♣</div>
            </div>
            <div class="middle card-item">
                <div>♣</div>
                <div>♣</div>
            </div>
            <div class="right card-item">
                <div>2</div>
                <div>♣</div>
            </div>
        </div>
        <div class="card card-3">
            <div class="left card-item">
                <div>3</div>
                <div>♥</div>
            </div>
            <div class="middle card-item">
                <div>♥</div>
                <div>♥</div>
                <div>♥</div>
            </div>
            <div class="right card-item">
                <div>3</div>
                <div>♥</div>
            </div>
        </div>
    </main>
</body>
</html>
