<DOCTYPE HTML>
<html en="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="styles.css"/>
  <title>Stylize to-do list</title>
</head>
<body>
  <main>
      <h1 class="todo-head">MY to do list</h1> 
      <ul class="todo-list">
        <li>
          <input type="checkbox" id="first-list"> 
          <label for="first-list">Explore gaming keyboards</label>
          <ul class="sub-item">
            <li>
              <a href="#" target="_blank" class="sub-item-link">Store Link</a>
            </li>
          </ul>
        </li>
        <li>
          <input type="checkbox" id="second-list"> 
          <label for="second-list">Finish the report</label>
          <ul class="sub-item">
            <li>
              <a href="#" target="_blank" class="sub-item-link">Request Access</a>
            </li>
          </ul>
        </li>
        <li>
          <input type="checkbox" id="third-list">
          <label for="third-list">View Phone's Warrenty</label>
          <ul class="sub-item">
            <li>
              <a href="#" target="_blank" class="sub-item-link">View Recipts</a>
            </li>
          </ul>
        </li>
        <li>
          <input type="checkbox" id="fourth-list">
          <label for="fourth-list">Check Processor's Specs</label>
          <ul class="sub-item">
            <li>
              <a href="#" target="_blank" class="sub-item-link">View Model Number</a>
            </li>
          </ul>
        </li>
      </ul>
    </main>
  </body>
</html>
